# How often (in ticks; 20 ticks = 1 second) to recompute the nearest cave
# and re-point every Cave Compass a player is carrying.
update-interval-ticks: 40

# Default search radius (in blocks, per axis) around each player. Can be
# overridden per compass with /cavecompass <target> <radius>.
# Larger values can find more distant targets but cost more to search when
# nothing is nearby (worst case is a full cube scan out to this radius).
search-radius: 48

# Upper limit for the radius players may choose with the command.
max-search-radius: 128

# Only search chunks that are already loaded, instead of forcing new ones
# to load just to check them for cave air.
only-loaded-chunks: true

# How "big"/airy a cave needs to be to count. A cave-air block only
# qualifies as a target if at least this many of the open (air or cave
# air) blocks in the cube around it (see openness-check-radius) are also
# open — this filters out thin crevices and single-block pockets in
# favour of real caverns. Lower this if the compass struggles to find
# anything within search-radius; raise it to hold out for bigger caves.
min-open-blocks: 20

# Half-width of the cube checked around each candidate cave-air block
# when judging its "openness" above. 2 means a 5x5x5 cube (124 other
# blocks checked, excluding the candidate itself).
openness-check-radius: 2

# Block search (/cavecompass <block> [radius] [count]): a block only counts
# if at least <count> blocks of that type lie within the cube of this
# half-width around it — e.g. a group of bee nests instead of a single one.
cluster-check-radius: 8

# <count> used when the command doesn't specify one.
default-cluster-size: 3
